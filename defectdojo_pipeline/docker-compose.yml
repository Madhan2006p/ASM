services:
  faraday-pipeline-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-asm_faraday}
      POSTGRES_USER: ${POSTGRES_USER:-asm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asm_password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FARADAY_URL: ${FARADAY_URL:-http://host.docker.internal:5985}
      FARADAY_USERNAME: ${FARADAY_USERNAME:-faraday}
      FARADAY_PASSWORD: ${FARADAY_PASSWORD:-changeme}
      FARADAY_WORKSPACE: ${FARADAY_WORKSPACE:-nuclei-asm}
      FARADAY_VERIFY_SSL: ${FARADAY_VERIFY_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asm_faraday}
      POSTGRES_USER: ${POSTGRES_USER:-asm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asm_password}
    volumes:
      - faraday_pipeline_pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asm} -d ${POSTGRES_DB:-asm_faraday}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faraday_pipeline_pg:
